[package]
name = "narayanastra"
version = "1.0.0"
edition = "2021"
authors = ["Kushagra Dwivedi <CyberHX>"]
description = "नारायणास्त्र — Vishnu's ultimate weapon. Post-compromise deep scanner for rootkits, backdoors & silent threats."
homepage = "https://cyberhx.com"
repository = "https://github.com/CyberHX/narayanastra"
license = "MIT"
keywords = ["security", "rootkit", "scanner", "forensics", "post-compromise"]
categories = ["command-line-utilities"]

[[bin]]
name = "narayanastra"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
chrono = { version = "0.4", features = ["serde"] }
ctrlc = "3.4"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
